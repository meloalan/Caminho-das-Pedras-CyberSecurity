<svg xmlns="http://www.w3.org/2000/svg" width="640" height="710" viewBox="0 0 640 710" role="img" aria-labelledby="title desc">
<title id="title">Recursos usados em conjunto</title><desc id="desc">Aplicações solicitam recursos ao sistema operacional e drivers. Estes coordenam CPU, RAM, armazenamento e interface de rede.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#45c7dd"/></marker></defs>
<rect width="640" height="710" rx="16" fill="#0c1829"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f6ff;font-size:27px;font-weight:bold}.label{fill:#f0f6ff;font-size:23px;font-weight:bold}.body{fill:#c4d5e9;font-size:20px}.small{fill:#c4d5e9;font-size:18px}.line{stroke:#45c7dd;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="48">Recursos usados em conjunto</text><rect x="80" y="86" width="480" height="90" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="120" text-anchor="middle"><tspan x="320.0" dy="0">Aplicações</tspan></text><text class="body" x="320.0" y="150" text-anchor="middle"><tspan x="320.0" dy="0">Editor, navegador e outros programas</tspan></text><path class="line" d="M320 176 L320 210"/><rect x="80" y="216" width="480" height="100" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="250" text-anchor="middle"><tspan x="320.0" dy="0">Sistema operacional</tspan></text><text class="body" x="320.0" y="280" text-anchor="middle"><tspan x="320.0" dy="0">Coordenação de recursos e drivers</tspan></text><path class="line" d="M320 316 L170 368"/><path class="line" d="M320 316 L470 368"/><rect x="30" y="376" width="280" height="100" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="170.0" y="410" text-anchor="middle"><tspan x="170.0" dy="0">CPU</tspan></text><text class="body" x="170.0" y="440" text-anchor="middle"><tspan x="170.0" dy="0">Executa instruções</tspan></text><rect x="330" y="376" width="280" height="100" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="470.0" y="410" text-anchor="middle"><tspan x="470.0" dy="0">RAM</tspan></text><text class="body" x="470.0" y="440" text-anchor="middle"><tspan x="470.0" dy="0">Mantém dados em uso</tspan></text><path d="M320 316 L320 490" stroke="#45c7dd" stroke-width="2.5" fill="none"/><path d="M320 490 L170 490 L170 506" class="line"/><path d="M320 490 L470 490 L470 506" class="line"/><rect x="30" y="514" width="280" height="100" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="170.0" y="548" text-anchor="middle"><tspan x="170.0" dy="0">Armazenamento</tspan></text><text class="body" x="170.0" y="578" text-anchor="middle"><tspan x="170.0" dy="0">Preserva arquivos</tspan></text><rect x="330" y="514" width="280" height="100" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="470.0" y="548" text-anchor="middle"><tspan x="470.0" dy="0">Interface de rede</tspan></text><text class="body" x="470.0" y="578" text-anchor="middle"><tspan x="470.0" dy="0">Permite comunicação</tspan></text><text class="small" x="32" y="657" text-anchor="start"><tspan x="32" dy="0">Um programa pode usar todos esses recursos.</tspan><tspan x="32" dy="27">O consumo precisa ser interpretado no contexto.</tspan></text></svg>
