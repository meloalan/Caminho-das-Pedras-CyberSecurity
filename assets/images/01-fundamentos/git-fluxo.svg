<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
<title id="title">Da edição à revisão</title><desc id="desc">Git mantém arquivos da cópia de trabalho, staging e commits no repositório local. Push publica uma branch no GitHub, onde um pull request propõe revisão e integração.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#45c7dd"/></marker></defs>
<rect width="640" height="820" rx="16" fill="#0c1829"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f6ff;font-size:27px;font-weight:bold}.label{fill:#f0f6ff;font-size:23px;font-weight:bold}.body{fill:#c4d5e9;font-size:20px}.small{fill:#c4d5e9;font-size:18px}.line{stroke:#45c7dd;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="48">Da edição à revisão</text><rect x="24" y="76" width="592" height="434" rx="12" fill="#10243a" stroke="#397693"/><text class="small" x="48" y="108" text-anchor="start"><tspan x="48" dy="0">NO SEU COMPUTADOR</tspan></text><rect x="100" y="128" width="440" height="82" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="162" text-anchor="middle"><tspan x="320.0" dy="0">Working Directory</tspan></text><text class="body" x="320.0" y="192" text-anchor="middle"><tspan x="320.0" dy="0">Arquivos que você edita</tspan></text><path class="line" d="M320 210 L320 253"/><text class="small" x="344" y="239" text-anchor="start"><tspan x="344" dy="0">git add</tspan></text><rect x="100" y="264" width="440" height="82" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="298" text-anchor="middle"><tspan x="320.0" dy="0">Staging</tspan></text><text class="body" x="320.0" y="328" text-anchor="middle"><tspan x="320.0" dy="0">Conteúdo do próximo commit</tspan></text><path class="line" d="M320 346 L320 389"/><text class="small" x="344" y="376" text-anchor="start"><tspan x="344" dy="0">git commit</tspan></text><rect x="100" y="400" width="440" height="82" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="434" text-anchor="middle"><tspan x="320.0" dy="0">Commit no repositório</tspan></text><text class="body" x="320.0" y="464" text-anchor="middle"><tspan x="320.0" dy="0">Repository: histórico local</tspan></text><path class="line" d="M320 510 L320 557"/><text class="small" x="344" y="543" text-anchor="start"><tspan x="344" dy="0">git push</tspan></text><rect x="100" y="568" width="440" height="82" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="602" text-anchor="middle"><tspan x="320.0" dy="0">GitHub: repositório remoto</tspan></text><text class="body" x="320.0" y="632" text-anchor="middle"><tspan x="320.0" dy="0">Branch publicada</tspan></text><path class="line" d="M320 650 L320 689"/><rect x="100" y="700" width="440" height="82" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="734" text-anchor="middle"><tspan x="320.0" dy="0">Pull Request</tspan></text><text class="body" x="320.0" y="764" text-anchor="middle"><tspan x="320.0" dy="0">Proposta de revisão e integração</tspan></text></svg>
