<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img" aria-labelledby="title desc">
<title id="title">Da pergunta ao resultado</title><desc id="desc">Usuário interage com terminal e shell. Um comando consulta o sistema operacional, que devolve saída. Um filtro seleciona informação útil, mas pode esconder contexto.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#45c7dd"/></marker></defs>
<rect width="640" height="850" rx="16" fill="#0c1829"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f6ff;font-size:27px;font-weight:bold}.label{fill:#f0f6ff;font-size:23px;font-weight:bold}.body{fill:#c4d5e9;font-size:20px}.small{fill:#c4d5e9;font-size:18px}.line{stroke:#45c7dd;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="48">Da pergunta ao resultado</text><rect x="110" y="80" width="420" height="64" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="114" text-anchor="middle"><tspan x="320.0" dy="0">Usuário: define a pergunta</tspan></text><path class="line" d="M320 144 L320 168"/><rect x="110" y="176" width="420" height="84" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="210" text-anchor="middle"><tspan x="320.0" dy="0">Terminal e shell</tspan></text><text class="body" x="320.0" y="240" text-anchor="middle"><tspan x="320.0" dy="0">Interface e interpretação</tspan></text><path class="line" d="M320 260 L320 284"/><rect x="110" y="292" width="420" height="64" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="326" text-anchor="middle"><tspan x="320.0" dy="0">Comando de consulta</tspan></text><path class="line" d="M320 356 L320 380"/><rect x="110" y="388" width="420" height="64" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="422" text-anchor="middle"><tspan x="320.0" dy="0">Sistema operacional</tspan></text><path class="line" d="M320 452 L320 476"/><rect x="110" y="484" width="420" height="64" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="518" text-anchor="middle"><tspan x="320.0" dy="0">Resultado: saída</tspan></text><path class="line" d="M320 548 L320 572"/><rect x="110" y="580" width="420" height="64" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="614" text-anchor="middle"><tspan x="320.0" dy="0">Filtro: seleciona dados</tspan></text><path class="line" d="M320 644 L320 668"/><rect x="110" y="676" width="420" height="64" rx="10" fill="#16413f" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="710" text-anchor="middle"><tspan x="320.0" dy="0">Informação útil</tspan></text><text class="small" x="320" y="788" text-anchor="middle"><tspan x="320" dy="0">Confira o que entrou e o que ficou de fora.</tspan><tspan x="320" dy="27">Texto e objetos exigem filtros diferentes.</tspan></text></svg>
