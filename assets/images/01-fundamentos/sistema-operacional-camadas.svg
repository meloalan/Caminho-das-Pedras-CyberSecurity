<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc">
<title id="title">Camadas do sistema</title><desc id="desc">Usuário interage com aplicações. O kernel está dentro do sistema operacional, que gerencia processos, serviços, arquivos, usuários e logs e usa hardware.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#45c7dd"/></marker></defs>
<rect width="640" height="780" rx="16" fill="#0c1829"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f6ff;font-size:27px;font-weight:bold}.label{fill:#f0f6ff;font-size:23px;font-weight:bold}.body{fill:#c4d5e9;font-size:20px}.small{fill:#c4d5e9;font-size:18px}.line{stroke:#45c7dd;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="48">Camadas do sistema</text><rect x="90" y="84" width="460" height="64" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="118" text-anchor="middle"><tspan x="320.0" dy="0">Usuário</tspan></text><path class="line" d="M320 148 L320 172"/><rect x="90" y="180" width="460" height="72" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="214" text-anchor="middle"><tspan x="320.0" dy="0">Aplicações</tspan></text><path class="line" d="M320 252 L320 280"/><rect x="30" y="288" width="580" height="310" rx="12" fill="#122f40" stroke="#45c7dd" stroke-width="2"/><text class="label" x="320" y="326" text-anchor="middle"><tspan x="320" dy="0">Sistema operacional</tspan></text><rect x="54" y="350" width="280" height="104" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="194.0" y="384" text-anchor="middle"><tspan x="194.0" dy="0">Kernel</tspan></text><text class="body" x="194.0" y="414" text-anchor="middle"><tspan x="194.0" dy="0">Memória e execução</tspan><tspan x="194.0" dy="27">Acesso a dispositivos</tspan></text><text class="body" x="364" y="377" text-anchor="start"><tspan x="364" dy="0">Processos</tspan><tspan x="364" dy="27">Serviços</tspan><tspan x="364" dy="27">Arquivos</tspan><tspan x="364" dy="27">Usuários</tspan><tspan x="364" dy="27">Logs</tspan></text><text class="small" x="54" y="566" text-anchor="start"><tspan x="54" dy="0">O kernel é parte do sistema operacional.</tspan></text><path class="line" d="M320 598 L320 628"/><rect x="90" y="636" width="460" height="76" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="670" text-anchor="middle"><tspan x="320.0" dy="0">Hardware</tspan></text><text class="small" x="320" y="752" text-anchor="middle"><tspan x="320" dy="0">Modelo conceitual de responsabilidades.</tspan></text></svg>
