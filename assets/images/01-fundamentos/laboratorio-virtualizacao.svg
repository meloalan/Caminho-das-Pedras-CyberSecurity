<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
<title id="title">Laboratório virtual</title><desc id="desc">Host contém hipervisor e VMs Windows e Linux. Uma rede interna conecta os convidados. NAT tracejado representa saída opcional para atualizações, que altera o isolamento.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#45c7dd"/></marker></defs>
<rect width="640" height="820" rx="16" fill="#0c1829"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f0f6ff;font-size:27px;font-weight:bold}.label{fill:#f0f6ff;font-size:23px;font-weight:bold}.body{fill:#c4d5e9;font-size:20px}.small{fill:#c4d5e9;font-size:18px}.line{stroke:#45c7dd;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text class="title" x="32" y="48">Laboratório virtual</text><rect x="24" y="82" width="592" height="490" rx="12" fill="#10243a" stroke="#397693" stroke-width="2"/><text class="label" x="320" y="119" text-anchor="middle"><tspan x="320" dy="0">Computador host</tspan></text><rect x="88" y="146" width="464" height="72" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="180" text-anchor="middle"><tspan x="320.0" dy="0">Hipervisor</tspan></text><path class="line" d="M240 218 L170 256"/><path class="line" d="M400 218 L470 256"/><rect x="44" y="266" width="264" height="106" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="176.0" y="300" text-anchor="middle"><tspan x="176.0" dy="0">VM Windows</tspan></text><text class="body" x="176.0" y="330" text-anchor="middle"><tspan x="176.0" dy="0">Sistema convidado</tspan></text><rect x="332" y="266" width="264" height="106" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="464.0" y="300" text-anchor="middle"><tspan x="464.0" dy="0">VM Linux</tspan></text><text class="body" x="464.0" y="330" text-anchor="middle"><tspan x="464.0" dy="0">Convidado opcional</tspan></text><path class="line" d="M176 372 L176 422"/><path class="line" d="M464 372 L464 422"/><rect x="88" y="430" width="464" height="80" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="320.0" y="464" text-anchor="middle"><tspan x="320.0" dy="0">Rede interna</tspan></text><text class="body" x="320.0" y="494" text-anchor="middle"><tspan x="320.0" dy="0">Comunicação entre convidados</tspan></text><text class="small" x="320" y="547" text-anchor="middle"><tspan x="320" dy="0">Sem saída externa neste segmento por padrão.</tspan></text><path class="line" stroke-dasharray="7 5" d="M44 320 L12 320 L12 616 L180 616"/><rect x="190" y="586" width="404" height="85" rx="10" fill="#162b43" stroke="#397693" stroke-width="1.5"/><text class="label" x="392.0" y="620" text-anchor="middle"><tspan x="392.0" dy="0">NAT opcional</tspan></text><text class="body" x="392.0" y="650" text-anchor="middle"><tspan x="392.0" dy="0">Atualizações: saída temporária</tspan></text><path class="line" d="M392 671 L392 700" stroke-dasharray="7 5"/><text class="body" x="392" y="730" text-anchor="middle"><tspan x="392" dy="0">Internet / destinos alcançáveis</tspan></text><text class="small" x="32" y="779" text-anchor="start"><tspan x="32" dy="0">NAT conectado muda o isolamento. Revise adaptadores.</tspan></text></svg>
