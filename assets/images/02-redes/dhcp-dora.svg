<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc">
<title id="title">DHCPv4: aquisição inicial</title><desc id="desc">Discover e Request de seleção inicial são broadcast no segmento; Offer e ACK respondem ao cliente conforme o modo adequado. A concessão é confirmada no ACK.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="890" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / REDES</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">DHCPv4: aquisição inicial</text>
<rect x="32" y="120" width="240" height="70" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="134" width="4" height="42" rx="2" fill="#61e0dd"/>
<text x="54" y="156" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Cliente</text>
<rect x="330" y="120" width="278" height="70" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="330" y="134" width="4" height="42" rx="2" fill="#61e0dd"/>
<text x="352" y="156" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Servidor DHCP</text>
<path d="M150 195 L150 690" fill="none" stroke="#32536f" stroke-width="2.5" stroke-dasharray="7 6"/>
<path d="M490 195 L490 690" fill="none" stroke="#32536f" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="320" y="231" font-size="26" fill="#eff7ff" text-anchor="middle" font-weight="bold">1  Discover</text>
<text x="320" y="258" font-size="21" fill="#bdd1e5" text-anchor="middle" font-weight="normal">Broadcast no segmento</text>
<path d="M150 278 L490 278" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="351" font-size="26" fill="#eff7ff" text-anchor="middle" font-weight="bold">2  Offer</text>
<text x="320" y="378" font-size="21" fill="#bdd1e5" text-anchor="middle" font-weight="normal">Proposta de configuração</text>
<path d="M490 398 L150 398" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="471" font-size="26" fill="#eff7ff" text-anchor="middle" font-weight="bold">3  Request</text>
<text x="320" y="498" font-size="21" fill="#bdd1e5" text-anchor="middle" font-weight="normal">Broadcast: oferta escolhida</text>
<path d="M150 518 L490 518" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="320" y="591" font-size="26" fill="#eff7ff" text-anchor="middle" font-weight="bold">4  ACK</text>
<text x="320" y="618" font-size="21" fill="#bdd1e5" text-anchor="middle" font-weight="normal">Confirmação da concessão</text>
<path d="M490 638 L150 638" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="720" width="576" height="96" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="734" width="4" height="68" rx="2" fill="#61e0dd"/>
<text x="54" y="756" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">IP + configuração + prazo</text>
<text x="54" y="788" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Relacionar concessão e horário do evento</text>
<text x="32" y="836" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Offer/ACK: unicast ou broadcast conforme cenário.</text>
<text x="32" y="862" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Fluxo sem relay; renovação pode ser diferente.</text>
</g></svg>
