<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-labelledby="title desc">
<title id="title">OSI: organizar as perguntas</title><desc id="desc">Sete camadas verticalmente, com exemplos de aplicação, transporte, rede, enlace e física e funções conceituais de sessão e apresentação.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="1030" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / REDES</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">OSI: organizar as perguntas</text>
<rect x="32" y="116" width="576" height="96" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="130" width="4" height="68" rx="2" fill="#99bfff"/>
<text x="54" y="152" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">7  Aplicação</text>
<text x="54" y="184" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">HTTP e DNS: mensagens da aplicação</text>
