<rect x="32" y="249" width="4" height="68" rx="2" fill="#99bfff"/>
<text x="54" y="271" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">6  Apresentação</text>
<text x="54" y="303" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Representação e transformação de dados</text>
<path d="M320 334 L320 350" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="354" width="576" height="96" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="368" width="4" height="68" rx="2" fill="#99bfff"/>
<text x="54" y="390" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">5  Sessão</text>
<text x="54" y="422" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Organização e continuidade do diálogo</text>
<path d="M320 453 L320 469" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
