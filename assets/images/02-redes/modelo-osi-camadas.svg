<text x="54" y="898" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Cabo, fibra e rádio: sinais no meio</text>
<text x="32" y="976" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Modelo de referência, não encaixe rígido de protocolos.</text>
<text x="32" y="1002" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">A pilha real pode reunir responsabilidades.</text>
