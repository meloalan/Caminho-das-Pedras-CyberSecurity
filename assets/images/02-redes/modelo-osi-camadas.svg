<text x="54" y="660" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">IP: endereçamento e roteamento</text>
<path d="M320 691 L320 707" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="711" width="576" height="96" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="725" width="4" height="68" rx="2" fill="#61e0dd"/>
