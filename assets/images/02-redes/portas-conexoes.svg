<svg xmlns="http://www.w3.org/2000/svg" width="640" height="890" viewBox="0 0 640 890" role="img" aria-labelledby="title desc">
<title id="title">Os dois lados da comunicação</title><desc id="desc">Processo cliente usa IP e porta locais, transporte TCP ou UDP e um endpoint remoto onde há um serviço. Exemplo numérico mostra TCP.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="890" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / REDES</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">Os dois lados da comunicação</text>
<rect x="32" y="118" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Processo: navegador</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Programa em execução no cliente</text>
<path d="M320 224 L320 254" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="266" width="576" height="132" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="280" width="4" height="104" rx="2" fill="#61e0dd"/>
<text x="54" y="302" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Endpoint de origem</text>
<text x="54" y="334" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">IP: 192.168.1.10</text>
<text x="54" y="363" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Porta dinâmica: 52341</text>
<path d="M320 406 L320 436" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="450" width="576" height="132" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="464" width="4" height="104" rx="2" fill="#99bfff"/>
<text x="54" y="486" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">Transporte: TCP neste exemplo</text>
<text x="54" y="518" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Também existem endpoints UDP</text>
<text x="54" y="547" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">O número da porta não confirma aplicação</text>
<path d="M320 590 L320 620" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="634" width="576" height="132" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="648" width="4" height="104" rx="2" fill="#61e0dd"/>
<text x="54" y="670" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Endpoint de destino</text>
<text x="54" y="702" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">IP: 203.0.113.10 | Porta: 443</text>
<text x="54" y="731" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Serviço de aplicação no servidor</text>
<text x="320" y="815" font-size="23" fill="#eff7ff" text-anchor="middle" font-weight="normal">A resposta inverte origem e destino.</text>
<text x="32" y="862" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Exemplo fictício; correlacione processo, horário e contexto.</text>
</g></svg>
