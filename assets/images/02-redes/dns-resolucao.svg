<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1060" viewBox="0 0 640 1060" role="img" aria-labelledby="title desc">
<title id="title">DNS: do nome à resposta</title><desc id="desc">Usuário informa nome ao browser. Cache pode responder; se necessário o resolvedor consulta DNS. A resposta volta à aplicação, que pode conectar ao servidor.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="1060" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / REDES</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">DNS: do nome à resposta</text>
<rect x="32" y="118" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Usuário → Browser</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Nome solicitado: example.com</text>
<path d="M320 224 L320 254" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="266" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="280" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="302" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Sistema e cache local</text>
<text x="54" y="334" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Resposta válida pode evitar consulta</text>
<path d="M320 372 L320 414" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="340" y="401" font-size="20" fill="#bdd1e5" text-anchor="start" font-weight="normal">Se necessário</text>
<rect x="32" y="426" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="440" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="462" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Resolvedor DNS</text>
<text x="54" y="494" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Usa cache ou busca na hierarquia DNS</text>
<path d="M320 532 L320 564" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="578" width="576" height="130" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="592" width="4" height="102" rx="2" fill="#99bfff"/>
<text x="54" y="614" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">Resposta ao cliente</text>
<text x="54" y="646" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">A, AAAA ou outro resultado</text>
<text x="54" y="675" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Não é ainda uma conexão ao site</text>
<path d="M320 716 L320 748" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="760" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="774" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="796" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Browser recebe o resultado</text>
<text x="54" y="828" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Escolhe endereço e pode iniciar conexão</text>
<path d="M320 866 L320 894" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="906" width="576" height="98" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="920" width="4" height="70" rx="2" fill="#61e0dd"/>
<text x="54" y="942" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Servidor de aplicação</text>
<text x="54" y="974" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Recebe a conexão, se houver alcance</text>
<text x="32" y="1032" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Fluxo simplificado; browser pode ter resolvedor próprio.</text>
</g></svg>
