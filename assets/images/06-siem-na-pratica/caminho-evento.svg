<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1164" viewBox="0 0 640 1164" role="img" aria-labelledby="title desc">
<title id="title">Do evento à melhoria</title><desc id="desc">Atividade gera registros; coleta, processamento e consulta sustentam detecção e investigação. O aprendizado volta para a cobertura e as regras.</desc>
