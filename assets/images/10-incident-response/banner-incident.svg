    <g fill="#91a6b5" font-size="12"><text x="939" y="251">sinal e contexto</text><text x="1124" y="251">fatos e escopo</text><text x="1309" y="251">decisão registrada</text><text x="1477" y="251">validar e aprender</text></g>
