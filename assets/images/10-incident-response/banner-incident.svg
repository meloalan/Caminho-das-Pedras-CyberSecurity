<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Caminho das Pedras, Incident Response</title>
  <desc id="desc">Módulo 10. Detectar, analisar, decidir, conter, recuperar e melhorar com evidências, escopo e coordenação.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#0d1924"/></linearGradient>
    <linearGradient id="blue" x2="1"><stop stop-color="#1687ff"/><stop offset="1" stop-color="#45b4ff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#173247" stroke-width="1" opacity=".68"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="520" fill="url(#bg)"/><rect x="800" width="800" height="450" fill="url(#grid)" opacity=".78"/>
  <rect x="70" y="56" width="10" height="70" rx="5" fill="url(#blue)"/>
  <text x="104" y="82" fill="#a8bac8" font-family="Arial,sans-serif" font-size="19" letter-spacing="1.1">CAMINHO DAS PEDRAS  •  CYBERSECURITY</text>
  <text x="1518" y="82" text-anchor="end" fill="#70899b" font-family="Arial,sans-serif" font-size="18">MÓDULO 10</text>
  <text x="70" y="226" fill="#238cff" font-family="Arial,sans-serif" font-size="108" font-weight="700">10</text>
  <text x="230" y="200" fill="#f2f6fa" font-family="Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="1">INCIDENT</text>
  <text x="230" y="258" fill="#f2f6fa" font-family="Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="1">RESPONSE</text>
  <text x="74" y="326" fill="#c5d0d8" font-family="Arial,sans-serif" font-size="24">Transforme evidências e incertezas em decisões coordenadas.</text>
  <text x="74" y="370" fill="#91a5b4" font-family="Arial,sans-serif" font-size="18">EVIDÊNCIA  •  ESCOPO  •  CONTENÇÃO  •  RECUPERAÇÃO  •  MELHORIA</text>
  <line x1="70" y1="440" x2="1530" y2="440" stroke="#304453"/>
  <text x="74" y="480" fill="#758d9e" font-family="Arial,sans-serif" font-size="17" letter-spacing=".6">EVIDÊNCIA + CONTEXTO + AUTORIDADE → RESPOSTA RESPONSÁVEL</text>
  <text x="1530" y="480" text-anchor="end" fill="#647d90" font-family="Arial,sans-serif" font-size="16">PROCESSO ANTES DA FERRAMENTA</text>
