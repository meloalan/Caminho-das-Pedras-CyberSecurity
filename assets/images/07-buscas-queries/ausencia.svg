<svg xmlns="http://www.w3.org/2000/svg" width="640" height="790" viewBox="0 0 640 790" role="img" aria-labelledby="title desc">
<title id="title">Quem deveria aparecer?</title><desc id="desc">A diferença entre inventário esperado e fontes observadas encontra um host sem registros. Isso pede validação de cobertura, não diagnóstico automático.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="790" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / BUSCAS E QUERIES</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">Quem deveria aparecer?</text>
<rect x="32" y="118" width="576" height="135" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="107" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Inventário esperado</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">WIN-LAB01, WIN-LAB02</text>
<text x="54" y="215" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">DC-LAB01, WIN-LAB03</text>
<rect x="32" y="301" width="576" height="104" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="315" width="4" height="76" rx="2" fill="#61e0dd"/>
<text x="54" y="337" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Hosts observados</text>
<text x="54" y="369" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">WIN-LAB01, WIN-LAB02, DC-LAB01</text>
<path d="M320 261 L320 291" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="458" width="576" height="104" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="472" width="4" height="76" rx="2" fill="#99bfff"/>
<text x="54" y="494" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">Diferença</text>
<text x="54" y="526" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">WIN-LAB03: sem registro nesse conjunto</text>
<path d="M320 413 L320 448" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="609" width="576" height="104" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="623" width="4" height="76" rx="2" fill="#61e0dd"/>
<text x="54" y="645" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Validar antes de decidir</text>
<text x="54" y="677" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Coleta, período, acesso e retenção</text>
<path d="M320 570 L320 599" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="32" y="762" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Ausência na pesquisa pode ter várias causas.</text>
</g></svg>
