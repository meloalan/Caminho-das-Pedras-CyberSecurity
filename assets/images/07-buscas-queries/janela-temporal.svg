<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
<title id="title">Antes não é perto</title><desc id="desc">Falhas precisam ocorrer antes do sucesso e dentro da janela. Bins fixos podem separar eventos próximos ou reunir ordem inversa.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="610" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / BUSCAS E QUERIES</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">Antes não é perto</text>
<rect x="32" y="117" width="576" height="106" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="131" width="4" height="78" rx="2" fill="#61e0dd"/>
<text x="54" y="153" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Janela anterior ao sucesso</text>
<text x="54" y="185" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Início incluso; sucesso excluído das falhas</text>
<path d="M70 310 L565 310" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="60" y="284" font-size="22" fill="#61e0dd" text-anchor="start" font-weight="normal">Falhas</text>
<text x="480" y="284" font-size="22" fill="#99bfff" text-anchor="start" font-weight="normal">Sucesso</text>
<circle cx="120" cy="310" r="7" fill="#61e0dd"/>
<text x="120" y="347" font-size="20" fill="#bdd1e5" text-anchor="middle" font-weight="normal">08:01</text>
<circle cx="230" cy="310" r="7" fill="#61e0dd"/>
<text x="230" y="347" font-size="20" fill="#bdd1e5" text-anchor="middle" font-weight="normal">08:02</text>
<circle cx="340" cy="310" r="7" fill="#61e0dd"/>
<text x="340" y="347" font-size="20" fill="#bdd1e5" text-anchor="middle" font-weight="normal">08:03</text>
<circle cx="530" cy="310" r="7" fill="#99bfff"/>
<text x="530" y="347" font-size="20" fill="#bdd1e5" text-anchor="middle" font-weight="normal">08:05</text>
<path d="M430 257 L430 369" fill="none" stroke="#32536f" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="430" y="399" font-size="20" fill="#bdd1e5" text-anchor="middle" font-weight="normal">Fronteira de bin ilustrativa</text>
<rect x="32" y="432" width="576" height="104" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="446" width="4" height="76" rx="2" fill="#61e0dd"/>
<text x="54" y="468" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Chave compatível</text>
<text x="54" y="500" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Conta + autoridade + host + origem + tipo</text>
<text x="32" y="582" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Proximidade no relógio não comprova causalidade.</text>
</g></svg>
