<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1164" viewBox="0 0 640 1164" role="img" aria-labelledby="title desc">
<title id="title">Segurança é um ciclo</title><desc id="desc">Ativo leva à avaliação de risco, controles, monitoramento, detecção, resposta e melhoria. A melhoria retorna à avaliação de risco.</desc>
