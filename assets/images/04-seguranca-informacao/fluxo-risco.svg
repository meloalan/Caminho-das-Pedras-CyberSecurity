<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1296" viewBox="0 0 640 1296" role="img" aria-labelledby="title desc">
<title id="title">Risco depende do contexto</title><desc id="desc">Ativo e valor, ameaça, vulnerabilidade, exposição e impacto sustentam avaliação de risco. Controles são verificados e o risco residual é reavaliado.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="1296" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / SEGURANÇA</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">Risco depende do contexto</text>
<rect x="32" y="118" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Ativo e valor</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">O que precisa ser protegido?</text>
<path d="M320 224 L320 244" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="250" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="264" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="286" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Ameaça</text>
<text x="54" y="318" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">O que pode causar dano?</text>
<path d="M320 356 L320 376" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="382" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="396" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="418" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Vulnerabilidade</text>
<text x="54" y="450" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Qual fraqueza contribui?</text>
<path d="M320 488 L320 508" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="514" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="528" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="550" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Exposição</text>
<text x="54" y="582" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Como o ativo pode ser alcançado?</text>
<path d="M320 620 L320 640" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="646" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="660" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="682" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Impacto</text>
<text x="54" y="714" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Quais consequências importam?</text>
<path d="M320 752 L320 772" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="792" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="814" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Risco</text>
<text x="54" y="846" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Possibilidade, consequência e incerteza</text>
<path d="M320 884 L320 904" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="910" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="924" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="946" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Controle</text>
<text x="54" y="978" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Medida e evidência de eficácia</text>
<path d="M320 1016 L320 1036" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="1042" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="1056" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="1078" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Risco residual</text>
<text x="54" y="1110" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">O que permanece e quando revisar?</text>
<text x="32" y="1268" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Roteiro de análise, não fórmula universal.</text>
</g></svg>
