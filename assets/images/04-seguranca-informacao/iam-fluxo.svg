<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1032" viewBox="0 0 640 1032" role="img" aria-labelledby="title desc">
<title id="title">Acesso: verificar e limitar</title><desc id="desc">Identidade é autenticada, com MFA quando aplicável, e recebe autorização para ações no recurso. Registros e revisão sustentam o ciclo de acesso.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="1032" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / SEGURANÇA</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">Acesso: verificar e limitar</text>
<rect x="32" y="118" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Identidade</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Pessoa, dispositivo ou workload</text>
<path d="M320 224 L320 244" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="250" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="264" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="286" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Autenticação</text>
<text x="54" y="318" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">MFA quando aplicável ao mecanismo</text>
<path d="M320 356 L320 376" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="382" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="396" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="418" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Autorização</text>
<text x="54" y="450" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Ação, recurso, escopo e contexto</text>
<path d="M320 488 L320 508" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="514" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="528" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="550" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Recurso</text>
<text x="54" y="582" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Operação permitida ou negada</text>
<path d="M320 620 L320 640" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="646" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="660" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="682" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Log</text>
<text x="54" y="714" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Identidade, ação, resultado e horário</text>
<path d="M320 752 L320 772" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="778" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="792" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="814" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Revisão</text>
<text x="54" y="846" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Acesso ainda é necessário?</text>
<text x="32" y="1004" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Autenticar não concede acesso a tudo.</text>
</g></svg>
