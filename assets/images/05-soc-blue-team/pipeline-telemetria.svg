<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1032" viewBox="0 0 640 1032" role="img" aria-labelledby="title desc">
<title id="title">Caminho da telemetria</title><desc id="desc">Atividade, geração, coleta, transporte, ingestão, parsing, normalização, indexação, consulta e regra antecedem o alerta. Cada etapa pode trazer atraso ou perda.</desc>
