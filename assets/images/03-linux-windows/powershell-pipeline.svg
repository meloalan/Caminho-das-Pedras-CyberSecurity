<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
<title id="title">PowerShell: objetos no pipeline</title><desc id="desc">Cmdlet Get Process produz objetos, Where Object filtra elementos, Select Object escolhe propriedades e o resultado atende uma pergunta.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="960" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / SISTEMAS</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">PowerShell: objetos no pipeline</text>
<rect x="32" y="118" width="576" height="110" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="82" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">01  Cmdlet</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Get-Process consulta processos</text>
<path d="M320 232 L320 260" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="268" width="576" height="110" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="282" width="4" height="82" rx="2" fill="#61e0dd"/>
<text x="54" y="304" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">02  Objetos</text>
<text x="54" y="336" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Propriedades como Name e Id</text>
<path d="M320 382 L320 410" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="418" width="576" height="110" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="432" width="4" height="82" rx="2" fill="#61e0dd"/>
<text x="54" y="454" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">03  Filtro</text>
<text x="54" y="486" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Where-Object escolhe elementos</text>
<path d="M320 532 L320 560" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="568" width="576" height="110" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="582" width="4" height="82" rx="2" fill="#61e0dd"/>
<text x="54" y="604" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">04  Seleção</text>
<text x="54" y="636" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Select-Object escolhe propriedades</text>
<path d="M320 682 L320 710" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="718" width="576" height="110" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="732" width="4" height="82" rx="2" fill="#61e0dd"/>
<text x="54" y="754" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">05  Resultado</text>
<text x="54" y="786" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Informação delimitada para a pergunta</text>
<text x="32" y="906" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Objetos de cmdlets não são apenas texto formatado.</text>
<text x="32" y="932" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Consultar não exige modificar o sistema.</text>
</g></svg>
