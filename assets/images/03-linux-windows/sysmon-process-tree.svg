<text x="54" y="872" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Analista</text>
<text x="54" y="904" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Relaciona GUID, host, tempo e identidade</text>
<text x="32" y="996" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Esquema conceitual, não evidência de laboratório.</text>
<text x="32" y="1022" font-size="19" fill="#bdd1e5" text-anchor="start" font-weight="normal">Criação de processo não implica conexão de rede.</text>
