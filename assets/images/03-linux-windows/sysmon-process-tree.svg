<text x="54" y="540" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Sysmon Event ID 1</text>
<rect x="330" y="472" width="278" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="330" y="486" width="4" height="72" rx="2" fill="#99bfff"/>
<text x="352" y="508" font-size="25" fill="#99bfff" text-anchor="start" font-weight="bold">Rede, se houver</text>
<text x="352" y="540" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Sysmon Event ID 3</text>
<text x="469" y="604" font-size="19" fill="#bdd1e5" text-anchor="middle" font-weight="normal">Exige cobertura de rede</text>
