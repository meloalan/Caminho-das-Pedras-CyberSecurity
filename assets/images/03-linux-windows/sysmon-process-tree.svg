<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1050" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
<title id="title">Sysmon: contexto de execução</title><desc id="desc">Processo pai se relaciona ao filho. Usuário e linha de comando ajudam a interpretar o evento de criação. Rede, quando ocorre e é coletada, pode acrescentar outro evento correlacionável.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#61e0dd"/></marker></defs>
<rect width="640" height="1050" rx="20" fill="#0b1526"/>
<g font-family="Arial, sans-serif">
<text x="32" y="36" font-size="16" fill="#61e0dd" text-anchor="start" font-weight="bold">CAMINHO DAS PEDRAS / SISTEMAS</text>
<text x="32" y="80" font-size="30" fill="#eff7ff" text-anchor="start" font-weight="bold">Sysmon: contexto de execução</text>
<rect x="32" y="118" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="132" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="154" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Processo pai</text>
<text x="54" y="186" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">ParentProcessGuid • ParentImage</text>
