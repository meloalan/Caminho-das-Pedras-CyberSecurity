<rect x="32" y="700" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="722" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Sysmon Operational</text>
<text x="54" y="754" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">Eventos distintos da mesma execução</text>
