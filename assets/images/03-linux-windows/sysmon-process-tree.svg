<text x="54" y="334" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">ProcessGuid • PID • início</text>
<text x="54" y="363" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">User • CommandLine</text>
<path d="M320 404 L320 432" fill="none" stroke="#32536f" stroke-width="2.5"/>
<path d="M172 432 L469 432" fill="none" stroke="#32536f" stroke-width="2.5"/>
