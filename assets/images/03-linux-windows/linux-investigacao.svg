<rect x="32" y="266" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
<rect x="32" y="280" width="4" height="72" rx="2" fill="#61e0dd"/>
<text x="54" y="302" font-size="25" fill="#61e0dd" text-anchor="start" font-weight="bold">Processo</text>
<text x="54" y="334" font-size="22" fill="#bdd1e5" text-anchor="start" font-weight="normal">PID • PPID • usuário • início</text>
<path d="M320 372 L320 402" fill="none" stroke="#61e0dd" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="32" y="414" width="576" height="100" rx="12" fill="#12243a" stroke="#32536f"/>
