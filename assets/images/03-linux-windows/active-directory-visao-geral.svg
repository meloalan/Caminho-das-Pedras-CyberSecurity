<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1050" viewBox="0 0 640 1050" role="img" aria-labelledby="title desc">
<title id="title">AD DS: identidade e contexto</title><desc id="desc">DNS permite localizar serviços de domínio. Domain Controller mantém diretório, com usuários, grupos, computadores e GPOs; autenticação e políticas podem produzir registros para investigação.</desc>
