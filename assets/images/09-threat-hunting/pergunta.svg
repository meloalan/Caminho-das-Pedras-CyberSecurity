<svg xmlns="http://www.w3.org/2000/svg" width="640" height="605" viewBox="0 0 640 605" role="img" aria-labelledby="title desc"><title id="title">A pergunta orienta a busca</title><desc id="desc">Abrir o SIEM e procurar algo estranho não define um hunt.</desc>
<rect width="640" height="605" rx="20" fill="#0b1526"/>
<g font-family="Arial,sans-serif"><text x="32" y="35" font-size="17" fill="#61e0dd">CAMINHO DAS PEDRAS / THREAT HUNTING</text><text x="32" y="80" font-size="30" fill="#eff7ff" font-weight="bold">A pergunta orienta a busca</text>
<rect x="32" y="110" width="576" height="116" rx="12" fill="#12243a" stroke="#32536f"/>
<text x="54" y="144" font-size="25" fill="#61e0dd" font-weight="bold">HIPÓTESE E PERGUNTA</text>
<text x="54" y="177" font-size="21" fill="#bdd1e5">O que seria observável?</text>
<text x="54" y="206" font-size="21" fill="#bdd1e5">O que enfraqueceria a explicação?</text>
<path d="M320 229 v17 m-6 -6 l6 7 6 -7" fill="none" stroke="#3288ff" stroke-width="3"/>
<rect x="32" y="255" width="576" height="116" rx="12" fill="#12243a" stroke="#32536f"/>
<text x="54" y="289" font-size="25" fill="#61e0dd" font-weight="bold">TELEMETRIA E COBERTURA</text>
<text x="54" y="322" font-size="21" fill="#bdd1e5">Fonte, campos, população e tempo.</text>
<text x="54" y="351" font-size="21" fill="#bdd1e5">Eu conseguiria observar se acontecesse?</text>
<path d="M320 374 v17 m-6 -6 l6 7 6 -7" fill="none" stroke="#3288ff" stroke-width="3"/>
<rect x="32" y="400" width="576" height="116" rx="12" fill="#12243a" stroke="#32536f"/>
<text x="54" y="434" font-size="25" fill="#61e0dd" font-weight="bold">DADOS E QUERY</text>
<text x="54" y="467" font-size="21" fill="#bdd1e5">Qual consulta responde agora?</text>
<text x="54" y="496" font-size="21" fill="#bdd1e5">Depois: interpretar e escolher o pivot.</text>
<text x="32" y="580" font-size="18" fill="#bdd1e5">Abrir o SIEM e procurar algo estranho não define um hunt.</text>
</g></svg>
